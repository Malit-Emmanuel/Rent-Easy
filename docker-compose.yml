services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: khp, POSTGRES_PASSWORD: khp, POSTGRES_DB: khp }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
